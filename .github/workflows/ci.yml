name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Offline tests (no network)
        run: PYTHONPATH=src python -m pytest -m "not network" -q
      - name: Re-run extraction + evaluation from committed data
        run: |
          PYTHONPATH=src python -m palimpsest corpus extract evaluate
